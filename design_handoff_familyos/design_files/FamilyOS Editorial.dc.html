      mum: "<svg viewBox='0 0 48 48' style='width:100%;height:100%;display:block' fill='none' stroke='#1A1510' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='24' cy='24' r='24' fill='#FCEADF' stroke='none'/><path d='M11.5 34 C10.5 17 16 11 24 11 C32 11 37.5 17 36.5 34 C33 25 31 21 24 21 C17 21 15 25 11.5 34 Z' fill='#1A1510' stroke='none'/><circle cx='24' cy='25' r='11.5' fill='#FFF6EC'/><path d='M13 24 a11 11 0 0 1 22 0 c-3.4-3.4 -7.4-4.8 -11-4.8 s-7.6 1.4 -11 4.8 z' fill='#1A1510' stroke='none'/><circle cx='20' cy='25.5' r='1.5' fill='#1A1510' stroke='none'/><circle cx='28' cy='25.5' r='1.5' fill='#1A1510' stroke='none'/><path d='M20.5 30 q3.5 2.5 7 0'/><circle cx='17.6' cy='29' r='1.6' fill='#E8503A' stroke='none' opacity='.4'/><circle cx='30.4' cy='29' r='1.6' fill='#E8503A' stroke='none' opacity='.4'/></svg>",

          { bits:[0,0,0,0,0,0,0], tasks:[ t('drums','Drums','drum','tally',4,60,0,0), t('c','Chinese homework','book','bar',5,30,0,0), t('m','Maths homework','pencil','bar',5,30,0,0) ] },
        ] },
        riley: { name: 'Riley', redeemed: 0, adjust: 0, weeks: [
          { bits:[1,0,1,1,1,0,1], tasks:[ t('guitar','Guitar','guitar','tally',4,60,4,0), t('c','Chinese homework','book','bar',5,30,5,0), t('m','Maths homework','pencil','bar',5,30,5,0) ] },
          { bits:[1,1,1,1,0,1,1], tasks:[ t('guitar','Guitar','guitar','tally',4,60,3,0), t('c','Chinese homework','book','bar',5,30,5,0), t('m','Maths homework','pencil','bar',5,30,5,0) ] },
          { bits:[1,0,0,0,0,0,0], tasks:[ t('guitar','Guitar','guitar','tally',4,60,1,1), t('c','Chinese homework','book','bar',5,30,5,0), t('m','Maths homework','pencil','bar',5,30,1,0) ] },
          { bits:[0,0,0,0,0,0,0], tasks:[ t('guitar','Guitar','guitar','tally',4,60,0,0), t('c','Chinese homework','book','bar',5,30,0,0), t('m','Maths homework','pencil','bar',5,30,0,0) ] },

  // ---------- helpers ----------
  icon(kind, px) { return React.createElement('div', { style: { width: px + 'px', height: px + 'px' }, dangerouslySetInnerHTML: { __html: this.SVG[kind] } }); }
  av(who, px) { return React.createElement('div', { style: { width: px + 'px', height: px + 'px', borderRadius: '50%', overflow: 'hidden' }, dangerouslySetInnerHTML: { __html: this.AV[who] } }); }

  enrich(kidId, wi) {
    const meta = this.weekMeta[wi]; const kid = this.state.kids[kidId]; const wk = kid.weeks[wi];
    let gained = 0;
    const tasks = wk.tasks.map(tk => {
      const earned = tk.approved >= tk.target; if (earned) gained += tk.reward;
      const dots = []; for (let i = 0; i < tk.target; i++) dots.push(i < tk.approved ? 'on' : (i < tk.approved + tk.pending ? 'pend' : 'off'));
      return { ...tk, earned, dots, barPct: Math.round(Math.min(tk.approved, tk.target) / tk.target * 100) + '%' };
    });
    const isCurrent = meta.state === 'current';
    const redeemed = isCurrent ? (kid.redeemed || 0) : 0;
    const adjust = isCurrent ? (kid.adjust || 0) : 0;
    const left = Math.max(0, gained - redeemed + adjust);
    return { meta, tasks, gained, left, redeemed, isCurrent, isPast: meta.state === 'past', isFuture: meta.state === 'future' };
  }

  dayCells(kidId, wi) {
    const meta = this.weekMeta[wi]; const bits = this.state.kids[kidId].weeks[wi].bits; const dates = this.weekDates[wi];
    const L = ['M','T','W','T','F','S','S'];
    return dates.map((n, i) => {
      let st;
      if (meta.state === 'future') st = 'muted';
      else if (meta.state === 'past') st = bits[i] ? 'done' : 'none';
      else { if (i < meta.today) st = bits[i] ? 'done' : 'none'; else if (i === meta.today) st = bits[i] ? 'todayDone' : 'today'; else st = 'ahead'; }
      return { w: L[i], n, st };
    });
  }

  // ---------- mutations ----------
  doLog(kidId, taskId) {
    this.setState(s => {
      const kids = { ...s.kids }; const kid = { ...kids[kidId] };
      kid.weeks = kid.weeks.map((w, i) => {
        if (i !== this.CUR) return w;
        const tasks = w.tasks.map(tk => tk.id === taskId ? { ...tk, pending: tk.pending + 1 } : tk);
        const bits = w.bits.slice(); if (this.weekMeta[this.CUR].today >= 0) bits[this.weekMeta[this.CUR].today] = 1;
        return { ...w, tasks, bits };
      });
      kids[kidId] = kid; return { kids };
    });
  }
  approve(kidId, taskId) {
    const kid = this.state.kids[kidId]; const tk = kid.weeks[this.CUR].tasks.find(x => x.id === taskId);
    if (!tk || tk.pending <= 0) return;
    const willEarn = tk.approved < tk.target && (tk.approved + 1) >= tk.target;
    this.setState(s => {
      const kids = { ...s.kids }; const k = { ...kids[kidId] };
      k.weeks = k.weeks.map((w, i) => i !== this.CUR ? w : { ...w, tasks: w.tasks.map(x => x.id === taskId ? { ...x, approved: x.approved + 1, pending: Math.max(0, x.pending - 1) } : x) });
      kids[kidId] = k; return { kids };
    }, () => {
      if (willEarn) this.setState(s => ({ pendingCel: { ...s.pendingCel, [kidId]: { who: kid.name, mins: tk.reward, task: tk.title } }, history: [{ who: kid.name, text: tk.title + ' target', mins: tk.reward, kind: 'earn', time: 'now' }, ...s.history] }));
    });
  }
  reject(kidId, taskId) {
    this.setState(s => {
      const kids = { ...s.kids }; const k = { ...kids[kidId] };
      k.weeks = k.weeks.map((w, i) => i !== this.CUR ? w : { ...w, tasks: w.tasks.map(x => x.id === taskId ? { ...x, pending: Math.max(0, x.pending - 1) } : x) });
      kids[kidId] = k; return { kids };
    });
  }
  adjustMin(kidId, delta) {
    this.setState(s => {
      const kids = { ...s.kids }; const k = { ...kids[kidId] }; k.adjust = (k.adjust || 0) + delta; kids[kidId] = k;
      return { kids, history: [{ who: k.name, text: (delta >= 0 ? 'Bonus minutes' : 'Minutes removed'), mins: delta, kind: 'adjust', time: 'now' }, ...s.history] };
    });
  }
  redeemConfirm() {
    const kidId = this.state.redeemKid; const x = this.enrich(kidId, this.CUR); const take = Math.min(this.state.redeemSel, x.left);
    if (take <= 0) { this.setState({ redeemOpen: false }); return; }
    this.setState(s => {
      const kids = { ...s.kids }; const k = { ...kids[kidId] }; k.redeemed = (k.redeemed || 0) + take; kids[kidId] = k;
      return { kids, redeemOpen: false, history: [{ who: k.name, text: 'Used screen time', mins: take, kind: 'redeem', time: 'now' }, ...s.history] };
    });
  }

  guardParent() {
    if (this.state.parentUnlocked) { this.setState({ view: 'parent' }); return; }
    this.setState({ pinOpen: true, pinEntry: '', pinError: false, pinPending: () => this.setState({ view: 'parent', parentUnlocked: true }) });
  }
  pressPin(d) { this.setState(s => { if (!s.pinOpen) return null; const en = s.pinEntry + d; if (en.length > 4) return null; if (en.length === 4 && en !== '1234') return { pinEntry: '', pinError: true }; return { pinEntry: en, pinError: false }; }); }
  backPin() { this.setState(s => ({ pinEntry: s.pinEntry.slice(0, -1), pinError: false })); }
  componentDidUpdate() {
    if (this.state.pinOpen && this.state.pinEntry === '1234' && !this._ph) {
      this._ph = true; const fn = this.state.pinPending;
      this.setState({ pinOpen: false, pinEntry: '', pinError: false, pinPending: null }, () => { this._ph = false; if (fn) fn(); });
    }
  }
  componentDidMount() { this._onR = () => this.setState({ vw: window.innerWidth }); window.addEventListener('resize', this._onR); }
  componentWillUnmount() { if (this._onR) window.removeEventListener('resize', this._onR); }
  wide() { return this.state.vw >= 880; }

  // ---------- HOME ----------
  HomeView() {
    const e = React.createElement;
    const rows = [
      { who: 'tyler', name: 'Tyler', role: 'Drums · homework', kid: true },

      e('div', { style: { fontSize: '13px', fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: '#97907F' } }, 'Tuesday · Wk 24'),
      e('div', { style: { fontSize: wide ? '52px' : '40px', fontWeight: 700, letterSpacing: '-0.02em', marginTop: '4px', marginBottom: '8px' } }, 'Who\u2019s here?'),

    else if (c.st === 'none') { wC = '#B7AE9D'; nC = '#8A8270'; }

  taskRow(kidId, t, x) {

    if (t.earned) action = e('span', { style: { display: 'flex', alignItems: 'center', gap: '6px', fontFamily: "'Nunito'", fontSize: '12.5px', fontWeight: 800, color: '#3E8E6E', flexShrink: 0 } }, e('span', { style: { width: '26px', height: '26px', borderRadius: '50%', background: '#3E8E6E', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px' } }, '\u2713'), '+' + t.reward);

    else if (x.isCurrent) action = e('button', { onClick: () => this.doLog(kidId, t.id), style: { fontFamily: "'Space Grotesk'", fontSize: '13px', fontWeight: 700, background: '#1A1510', color: '#fff', border: 0, borderRadius: '8px', padding: '11px 15px', cursor: 'pointer', flexShrink: 0 } }, 'I did it');
    else if (x.isPast) action = e('span', { style: { fontFamily: "'Nunito'", fontSize: '12px', fontWeight: 800, color: '#B8B0A2', flexShrink: 0 } }, 'not finished');
    const prog = t.display === 'tally'
      ? e('div', { style: { display: 'flex', gap: '6px', marginTop: '7px' } }, t.dots.map((d, i) => e('span', { key: i, style: { width: '16px', height: '16px', borderRadius: '5px', background: d === 'on' ? '#1A1510' : 'transparent', border: d === 'on' ? '0' : (d === 'pend' ? '1.5px dashed #E8503A' : '1.5px dashed #D8CDBA') } })))
      : e('div', { style: { height: '8px', background: '#EDE7DB', borderRadius: '999px', overflow: 'hidden', marginTop: '8px' } }, e('div', { style: { width: t.barPct, height: '100%', background: '#1A1510', borderRadius: '999px' } }));
    return e('div', { key: t.id, style: { display: 'flex', alignItems: 'center', gap: '14px', padding: '17px 0', borderBottom: '1px solid #EAE3D6' } },
      e('div', { style: { width: '48px', height: '48px', borderRadius: '13px', background: t.earned ? '#EAF3EE' : '#F3ECDF', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 } }, this.icon(t.kind, 30)),
      e('div', { style: { flex: 1, minWidth: 0 } },
        e('div', { style: { fontSize: '17px', fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, t.title), prog),
      action);
  }

  KidView() {
    const e = React.createElement;
    const kidId = this.state.activeKid; const wi = this.state.wi; const x = this.enrich(kidId, wi);
    const cells = this.dayCells(kidId, wi).map((c, i) => e('div', { key: i }, this.dayCellEl(c)));
    const navBtn = (label, enabled, fn) => e('button', { onClick: enabled ? fn : null, style: { width: '40px', height: '40px', borderRadius: '10px', border: '1.5px solid ' + (enabled ? '#1A1510' : '#E0D9CC'), background: '#FAF7F1', color: enabled ? '#1A1510' : '#CFC7B8', fontSize: '22px', cursor: enabled ? 'pointer' : 'default', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, fontFamily: "'Space Grotesk'", paddingBottom: '3px' } }, label);
    const tagColor = x.isCurrent ? '#E8503A' : (x.isFuture ? '#B8B0A2' : '#97907F');

    const scroll = e('div', { style: { flex: 1, overflowY: 'auto' } },
      // header
      e('div', { style: { display: 'flex', alignItems: 'center', gap: '13px', padding: '4px 26px 14px' } },
        e('div', { style: { width: '46px', height: '46px', flexShrink: 0 } }, this.av(kidId, 46)),
        e('div', null, e('div', { style: { fontSize: '22px', fontWeight: 700, letterSpacing: '-0.01em' } }, this.state.kids[kidId].name))),
      // week picker
      e('div', { style: { padding: '0 22px 14px', display: 'flex', alignItems: 'center', gap: '8px' } },
        navBtn('\u2039', wi > 0, () => this.setState({ wi: wi - 1 })),
        e('div', { style: { flex: 1, textAlign: 'center' } },
          e('div', { style: { fontSize: '17px', fontWeight: 700, letterSpacing: '-0.01em' } }, x.meta.label),
          e('div', { style: { fontFamily: "'Nunito'", fontSize: '12px', fontWeight: 800, letterSpacing: '.04em', textTransform: 'uppercase', color: tagColor, marginTop: '1px' } }, x.meta.tag)),
        navBtn('\u203a', wi < 3, () => this.setState({ wi: wi + 1 }))),
      // calendar strip
      e('div', { style: { padding: '0 18px 16px' } }, e('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: '4px', background: '#F3ECDF', borderRadius: '14px', padding: '10px 8px' } }, cells)),
      // hero
      e('div', { style: { padding: '18px 26px 18px', borderTop: '1.5px solid #1A1510' } },
        e('div', { style: { display: 'flex', alignItems: 'flex-start', gap: '12px' } },
          e('span', { style: { fontSize: '84px', fontWeight: 700, letterSpacing: '-0.05em', lineHeight: .8 } }, x.gained),
          e('span', { style: { fontSize: '14px', fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', color: '#E8503A', paddingTop: '6px', lineHeight: 1.2 } }, e('span', null, 'minutes'), e('br'), e('span', null, 'gained'))),
        e('div', { style: { marginTop: '16px', height: '6px', background: '#EDE7DB', borderRadius: '999px', overflow: 'hidden' } }, e('div', { style: { width: Math.round(Math.min(x.gained, 120) / 120 * 100) + '%', height: '100%', background: '#E8503A', borderRadius: '999px', transition: 'width 300ms ease' } })),
        e('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: '8px', fontFamily: "'Nunito'", fontSize: '13px', fontWeight: 700, color: '#97907F' } }, e('span', null, x.gained + ' of 120 mins'), e('span', null, 'max 2 hrs / week'))),
      // tasks
      e('div', { style: { padding: '0 26px' } },
        e('div', { style: { fontSize: '12px', fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: '#97907F' } }, 'Tasks'),
        x.tasks.map(t => this.taskRow(kidId, t, x))),
      // footer
      e('div', { style: { padding: '20px 26px 28px' } },
        x.isCurrent
          ? e('div', null,
              e('button', { onClick: () => this.setState({ redeemOpen: true, redeemKid: kidId, redeemSel: Math.min(30, x.left) || 15 }), style: { width: '100%', fontFamily: "'Space Grotesk'", fontSize: '16px', fontWeight: 700, background: '#E8503A', color: '#fff', border: 0, borderRadius: '10px', height: '54px', cursor: 'pointer' } }, 'Use screen time \u2192'),
              e('div', { style: { textAlign: 'center', fontFamily: "'Nunito'", fontSize: '13px', fontWeight: 700, color: '#97907F', marginTop: '10px' } }, x.left + ' mins left to use this week'))
          : e('div', { style: { textAlign: 'center', fontFamily: "'Nunito'", fontSize: '14px', fontWeight: 800, color: x.isFuture ? '#B8B0A2' : '#97907F', padding: '8px 0' } }, x.isFuture ? 'This week hasn\u2019t started yet' : ('Week finished · ' + x.gained + ' mins gained'))));

    return e('div', { style: { height: '100%', display: 'flex', flexDirection: 'column', maxWidth: this.wide() ? '640px' : 'none', margin: '0 auto', width: '100%' } }, this.topBar('My week', null), scroll);
  }

  // ---------- PARENT ----------
  ParentView() {
    const e = React.createElement;
    const queue = [];
    ['tyler', 'riley'].forEach(kidId => {
      this.state.kids[kidId].weeks[this.CUR].tasks.forEach(t => { if (t.pending > 0) queue.push({ kidId, name: this.state.kids[kidId].name, t }); });
    });
    const queueEls = queue.length === 0
      ? e('div', { style: { padding: '26px', textAlign: 'center', fontFamily: "'Nunito'", fontSize: '14px', fontWeight: 700, color: '#B8B0A2' } }, 'Nothing to check right now')
      : queue.map(q => e('div', { key: q.kidId + q.t.id, style: { display: 'flex', alignItems: 'center', gap: '13px', padding: '13px 0', borderBottom: '1px solid #EAE3D6' } },
          e('div', { style: { width: '44px', height: '44px', borderRadius: '12px', background: '#F3ECDF', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 } }, this.icon(q.t.kind, 28)),
          e('div', { style: { flex: 1, minWidth: 0 } },
            e('div', { style: { fontSize: '16px', fontWeight: 600 } }, q.name + ' · ' + q.t.title),
            e('div', { style: { fontFamily: "'Nunito'", fontSize: '12.5px', fontWeight: 700, color: '#97907F' } }, '+' + q.t.reward + ' mins when finished')),
          e('button', { onClick: () => this.reject(q.kidId, q.t.id), style: { width: '40px', height: '40px', borderRadius: '10px', border: '1.5px solid #E0D9CC', background: '#FAF7F1', color: '#B8B0A2', fontSize: '17px', cursor: 'pointer', flexShrink: 0 } }, '\u2715'),
          e('button', { onClick: () => this.approve(q.kidId, q.t.id), style: { height: '40px', padding: '0 16px', borderRadius: '10px', border: 0, background: '#3E8E6E', color: '#fff', fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: '14px', cursor: 'pointer', flexShrink: 0 } }, 'Approve')));

    const kidSummary = (kidId) => {
      const x = this.enrich(kidId, this.CUR);
      return e('div', { style: { padding: '16px 0', borderBottom: '1px solid #EAE3D6' } },
        e('div', { style: { display: 'flex', alignItems: 'center', gap: '11px', marginBottom: '12px' } },
          e('div', { style: { width: '36px', height: '36px', flexShrink: 0 } }, this.av(kidId, 36)),
          e('div', { style: { flex: 1 } }, e('div', { style: { fontSize: '17px', fontWeight: 700 } }, x.meta && this.state.kids[kidId].name)),
          e('div', { style: { textAlign: 'right' } }, e('span', { style: { fontSize: '22px', fontWeight: 700, color: '#E8503A' } }, x.gained), e('span', { style: { fontFamily: "'Nunito'", fontSize: '12px', fontWeight: 800, color: '#97907F' } }, ' gained'))),
        e('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } }, x.tasks.map(t => e('div', { key: t.id, style: { display: 'flex', alignItems: 'center', gap: '10px' } },
          e('div', { style: { width: '20px', height: '20px', flexShrink: 0 } }, this.icon(t.kind, 20)),
          e('div', { style: { flex: 1 } },
            e('div', { style: { display: 'flex', justifyContent: 'space-between', fontFamily: "'Nunito'", fontSize: '12.5px', fontWeight: 700, color: '#6B665D', marginBottom: '3px' } }, e('span', null, t.title), e('span', { style: { color: t.earned ? '#3E8E6E' : '#B8B0A2' } }, t.earned ? '\u2713 +' + t.reward : (t.approved + '/' + t.target))),
            e('div', { style: { height: '6px', background: '#EDE7DB', borderRadius: '999px', overflow: 'hidden' } }, e('div', { style: { width: t.barPct, height: '100%', background: t.earned ? '#3E8E6E' : '#1A1510', borderRadius: '999px' } })))))),
        e('div', { style: { display: 'flex', gap: '8px', marginTop: '13px' } },
          e('button', { onClick: () => this.adjustMin(kidId, 15), style: { flex: 1, height: '36px', borderRadius: '9px', border: '1.5px solid #1A1510', background: '#FAF7F1', color: '#1A1510', fontFamily: "'Space Grotesk'", fontSize: '13px', fontWeight: 700, cursor: 'pointer' } }, '+15 bonus'),
          e('button', { onClick: () => this.adjustMin(kidId, -15), style: { flex: 1, height: '36px', borderRadius: '9px', border: '1.5px solid #E0D9CC', background: '#FAF7F1', color: '#97907F', fontFamily: "'Space Grotesk'", fontSize: '13px', fontWeight: 700, cursor: 'pointer' } }, '−15')));
    };

    const histIcon = { earn: '+', redeem: '–', adjust: '±' };
    const histColor = { earn: '#3E8E6E', redeem: '#1A1510', adjust: '#97907F' };
    const hist = this.state.history.slice(0, 5).map((h, i) => e('div', { key: i, style: { display: 'flex', alignItems: 'center', gap: '12px', padding: '10px 0', borderBottom: '1px solid #EAE3D6' } },
      e('div', { style: { flex: 1 } }, e('div', { style: { fontSize: '14px', fontWeight: 600 } }, h.who + ' · ' + h.text), e('div', { style: { fontFamily: "'Nunito'", fontSize: '12px', fontWeight: 700, color: '#B8B0A2' } }, h.time)),
      e('div', { style: { fontFamily: "'Nunito'", fontSize: '15px', fontWeight: 800, color: histColor[h.kind] } }, (h.mins >= 0 ? '+' : '−') + Math.abs(h.mins) + 'm')));

    const lock = e('div', { style: { display: 'inline-flex', alignItems: 'center', gap: '6px', fontFamily: "'Nunito'", fontSize: '12px', fontWeight: 800, color: '#3E8E6E', background: '#EAF3EE', borderRadius: '999px', padding: '7px 12px' } }, 'Unlocked');

    const lbl = (txt) => e('div', { style: { fontSize: '12px', fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: '#97907F', margin: '18px 0 2px' } }, txt);
    const headerEl = e('div', { style: { display: 'flex', alignItems: 'center', gap: '13px', marginBottom: '6px' } },
      e('div', { style: { width: '46px', height: '46px', flexShrink: 0 } }, this.av('mum', 46)),
      e('div', { style: { flex: 1 } }, e('div', { style: { fontSize: '24px', fontWeight: 700, letterSpacing: '-0.01em' } }, 'Mum\u2019s desk'), e('div', { style: { fontFamily: "'Nunito'", fontSize: '13px', fontWeight: 700, color: '#97907F' } }, 'This week · Jun 15–21')));
    const queueSection = e('div', null, lbl('To check' + (queue.length ? ' · ' + queue.length : '')), queueEls);
    const weekSection = e('div', null, lbl('This week'), kidSummary('tyler'), kidSummary('riley'));
    const histSection = e('div', null, lbl('Recent'), hist);
    if (this.wide()) {
      return e('div', { style: { height: '100%', display: 'flex', flexDirection: 'column', maxWidth: '1120px', margin: '0 auto', width: '100%' } },
        this.topBar('Parent', lock),
        e('div', { style: { padding: '6px 32px 0' } }, headerEl),
        e('div', { style: { display: 'flex', flex: 1, minHeight: 0, gap: '32px', padding: '4px 32px 28px' } },
          e('div', { style: { flex: 1, overflowY: 'auto' } }, queueSection, histSection),
          e('div', { style: { flex: 1, overflowY: 'auto', borderLeft: '1.5px solid #EAE3D6', paddingLeft: '32px' } }, weekSection)));
    }
    const scroll = e('div', { style: { flex: 1, overflowY: 'auto', padding: '4px 26px 28px' } }, headerEl, queueSection, weekSection, histSection);
    return e('div', { style: { height: '100%', display: 'flex', flexDirection: 'column' } }, this.topBar('Parent', lock), scroll);
  }

  // ---------- overlays ----------
  overlays() {
    const e = React.createElement; const out = [];
    const c = (this.state.view === 'kid') ? this.state.pendingCel[this.state.activeKid] : null;
    const clearCel = () => this.setState(s => { const pc = { ...s.pendingCel }; delete pc[this.state.activeKid]; return { pendingCel: pc }; });
    if (c) {
      const confetti = Array.from({ length: 16 }).map((_, i) => { const cols = ['#E8503A','#1A1510','#3E8E6E','#F0B429']; return e('span', { key: i, style: { position: 'absolute', top: '-20px', left: (Math.random()*100)+'%', width: '9px', height: (Math.random()>.5?9:14)+'px', background: cols[i%4], borderRadius: Math.random()>.5?'999px':'2px', animation: 'fos-fall ' + (1.8+Math.random()*1.6) + 's linear ' + (Math.random()*.6) + 's infinite' } }); });
      out.push(e('div', { key: 'cel', onClick: clearCel, style: { position: 'absolute', inset: 0, zIndex: 30, background: 'linear-gradient(160deg,#E8503AF2,#E8503AE0)', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden' } },
        e('div', { style: { position: 'absolute', inset: 0, pointerEvents: 'none' } }, confetti),
        e('div', { style: { position: 'relative', background: '#FAF7F1', borderRadius: '22px', padding: '36px 40px', textAlign: 'center', boxShadow: '0 24px 60px rgba(0,0,0,.25)', animation: 'fos-pop 340ms cubic-bezier(0,0,0.2,1)' } },
          e('div', { style: { fontSize: '12px', fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: '#97907F' } }, c.who + ' earned'),
          e('div', { style: { fontSize: '88px', fontWeight: 700, letterSpacing: '-0.04em', lineHeight: 1, color: '#E8503A', margin: '6px 0' } }, '+' + c.mins),
          e('div', { style: { fontSize: '18px', fontWeight: 700 } }, 'minutes of screen time'),
          e('div', { style: { fontFamily: "'Nunito'", fontSize: '13px', fontWeight: 700, color: '#97907F', marginTop: '4px' } }, c.task + ' complete'),
          e('button', { onClick: clearCel, style: { marginTop: '22px', height: '48px', padding: '0 34px', border: 0, borderRadius: '12px', background: '#1A1510', color: '#fff', fontFamily: "'Space Grotesk'", fontSize: '16px', fontWeight: 700, cursor: 'pointer' } }, 'Nice!'))));
    }
    if (this.state.redeemOpen) {
      const x = this.enrich(this.state.redeemKid, this.CUR);
      const opts = [15, 30, 60].map(m => { const bad = m > x.left; const act = this.state.redeemSel === m; return e('button', { key: m, onClick: () => !bad && this.setState({ redeemSel: m }), style: { flex: 1, height: '50px', borderRadius: '11px', fontFamily: "'Space Grotesk'", fontSize: '16px', fontWeight: 700, cursor: bad ? 'not-allowed' : 'pointer', background: bad ? '#F0EBE1' : (act ? '#1A1510' : '#FAF7F1'), color: bad ? '#C9C1B2' : (act ? '#fff' : '#1A1510'), border: '1.5px solid ' + (bad ? '#EADFCB' : '#1A1510') } }, m + 'm'); });
      out.push(e('div', { key: 'rd', onClick: () => this.setState({ redeemOpen: false }), style: { position: 'absolute', inset: 0, zIndex: 25, background: 'rgba(26,21,16,.4)', display: 'flex', alignItems: 'flex-end' } },
        e('div', { onClick: (ev) => ev.stopPropagation(), style: { width: '100%', background: '#FAF7F1', borderRadius: '22px 22px 0 0', padding: '24px 26px 30px', boxShadow: '0 -10px 40px rgba(0,0,0,.2)' } },
          e('div', { style: { fontSize: '20px', fontWeight: 700, letterSpacing: '-0.01em' } }, 'Use screen time'),
          e('div', { style: { fontFamily: "'Nunito'", fontSize: '13px', fontWeight: 700, color: '#97907F', marginTop: '2px', marginBottom: '16px' } }, x.left + ' mins available'),
          e('div', { style: { display: 'flex', gap: '8px', marginBottom: '14px' } }, opts),
          e('div', { style: { display: 'flex', gap: '8px' } },
            e('button', { onClick: () => this.setState({ redeemOpen: false }), style: { flex: 1, height: '50px', borderRadius: '11px', border: '1.5px solid #E0D9CC', background: '#FAF7F1', color: '#97907F', fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: '15px', cursor: 'pointer' } }, 'Cancel'),
            e('button', { onClick: () => this.redeemConfirm(), style: { flex: 2, height: '50px', borderRadius: '11px', border: 0, background: x.left > 0 ? '#E8503A' : '#C9C1B2', color: '#fff', fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: '15px', cursor: x.left > 0 ? 'pointer' : 'not-allowed' } }, 'Use ' + this.state.redeemSel + ' mins')))));
    }
    if (this.state.pinOpen) {
      const len = this.state.pinEntry.length;
      const dots = [0,1,2,3].map(i => e('div', { key: i, style: { width: '14px', height: '14px', borderRadius: '999px', background: i < len ? '#1A1510' : '#E0D9CC' } }));
      const keys = ['1','2','3','4','5','6','7','8','9','','0','<'].map((k, i) => e('button', { key: i, onClick: () => k === '<' ? this.backPin() : (k ? this.pressPin(k) : null), style: { height: '54px', borderRadius: '12px', border: k ? '1.5px solid #EAE3D6' : '0', background: k ? '#FAF7F1' : 'transparent', fontFamily: "'Space Grotesk'", fontSize: '22px', fontWeight: 700, color: '#1A1510', cursor: k ? 'pointer' : 'default' } }, k === '<' ? '\u232b' : k));
      out.push(e('div', { key: 'pin', onClick: () => this.setState({ pinOpen: false, pinEntry: '', pinError: false }), style: { position: 'absolute', inset: 0, zIndex: 28, background: 'rgba(26,21,16,.45)', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
        e('div', { onClick: (ev) => ev.stopPropagation(), style: { background: '#FAF7F1', borderRadius: '20px', padding: '26px', width: '300px', textAlign: 'center', boxShadow: '0 24px 60px rgba(0,0,0,.3)' } },
          e('div', { style: { fontSize: '19px', fontWeight: 700 } }, 'Parent PIN'),
          e('div', { style: { fontFamily: "'Nunito'", fontSize: '13px', fontWeight: 700, color: '#97907F', marginTop: '2px' } }, 'Enter 1234 to approve'),
          e('div', { style: { display: 'flex', gap: '12px', justifyContent: 'center', margin: '18px 0' } }, dots),
          this.state.pinError ? e('div', { style: { fontFamily: "'Nunito'", fontSize: '13px', fontWeight: 800, color: '#E8503A', marginBottom: '10px' } }, 'Try again') : null,
          e('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '10px' } }, keys))));
    }
    return out;
  }

  renderVals() {
    const e = React.createElement;
    let view;
    if (this.state.view === 'home') view = this.HomeView();
    else if (this.state.view === 'kid') view = this.KidView();
    else view = this.ParentView();
    const screen = e('div', { style: { position: 'relative', height: '100%', width: '100%', overflow: 'hidden', background: '#FAF7F1' } }, view, ...this.overlays());
    return { screen };
  }
}
</script>
</body>
</html>
